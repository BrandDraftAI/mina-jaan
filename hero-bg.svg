<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="72%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#4a1016"/>
      <stop offset="38%" stop-color="#2a0c11"/>
      <stop offset="72%" stop-color="#140a0c"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
    </filter>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7a1622" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3a0a10" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- base wash -->
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- faint calla-lily silhouettes, echoing the covers, upper right -->
  <g opacity="0.5" transform="translate(1080,120) rotate(14)">
    <path d="M120 40 C40 120 20 300 120 420 C150 300 230 250 300 300 C300 150 240 60 120 40 Z" fill="url(#petal)"/>
    <path d="M150 420 C150 560 150 740 160 880" stroke="#5a1019" stroke-width="7" fill="none" stroke-opacity="0.35"/>
    <path d="M300 300 C360 260 430 270 470 330" stroke="#5a1019" stroke-width="5" fill="none" stroke-opacity="0.22"/>
  </g>
  <g opacity="0.32" transform="translate(1320,340) rotate(-8) scale(0.8)">
    <path d="M120 40 C40 120 20 300 120 420 C150 300 230 250 300 300 C300 150 240 60 120 40 Z" fill="url(#petal)"/>
    <path d="M150 420 C150 560 150 740 160 880" stroke="#5a1019" stroke-width="7" fill="none" stroke-opacity="0.3"/>
  </g>

  <!-- texture + vignette -->
  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.5"/>
  <rect width="1600" height="1000" fill="url(#vignette)"/>
</svg>
